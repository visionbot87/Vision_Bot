
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision Bot | JARVIS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #10253a, #050a12 65%);
      color: #eaf8ff;
    }

    .status {
      position: fixed;
      top: 18px;
      left: 20px;
      color: #76eaff;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .center {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .orb {
      width: 130px;
      height: 130px;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 1px solid #60e5ff;
      box-shadow: 0 0 45px #00bfff45, inset 0 0 30px #00bfff30;
      display: grid;
      place-items: center;
      font-size: 42px;
      color: #8cecff;
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      50% { box-shadow: 0 0 65px #00bfff70, inset 0 0 40px #00bfff50; }
    }

    h1 { letter-spacing: 7px; font-size: 27px; }
    .muted { color: #8ca9bb; font-size: 14px; }

    .chat {
      width: min(650px, 100%);
      margin: 26px auto 110px;
      text-align: left;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      background: #102031;
      border: 1px solid #234156;
      border-radius: 14px;
      padding: 13px 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user { border-color: #187c9c; }
    .error { border-color: #a34a4a; }

    .pill {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, calc(100% - 24px));
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: #081522ed;
      border: 1px solid #2b536a;
      border-radius: 22px;
      box-shadow: 0 0 35px #00aaff25;
      backdrop-filter: blur(18px);
    }

    button, input {
      font: inherit;
      color: #eaf8ff;
      background: #10283a;
      border: 1px solid #31566c;
      border-radius: 13px;
      padding: 12px;
    }

    button { cursor: pointer; }
    button:hover { border-color: #67e7ff; }
    button:disabled { opacity: .5; cursor: wait; }

    #prompt {
      min-width: 0;
      flex: 1;
      outline: none;
    }

    #mic { color: #82eaff; font-size: 19px; }
    #send { background: #0a7598; }

    .tools {
      position: fixed;
      top: 12px;
      right: 14px;
      display: flex;
      gap: 8px;
    }

    .tools button { font-size: 12px; }
    #settings {
      display: none;
      position: fixed;
      top: 58px;
      right: 14px;
      width: min(310px, calc(100% - 28px));
      padding: 18px;
      border: 1px solid #31566c;
      border-radius: 16px;
      background: #091522;
    }

    #settings input { width: 100%; margin: 8px 0; }

    @media (max-width: 480px) {
      .pill { bottom: 8px; gap: 5px; }
      button, input { padding: 10px 8px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="status" id="status">● JARVIS READY</div>

  <div class="tools">
    <button id="chatMode">Chat</button>
    <button id="writeMode">Writing</button>
    <button id="settingsBtn">⚙ Settings</button>
  </div>

  <div id="settings">
    <strong>Vision Bot Settings</strong>
    <p class="muted">Model: Gemini 2.5 Flash</p>
    <label for="voiceSelect">Voice response</label>
    <select id="voiceSelect" style="width:100%;margin:8px 0;padding:10px;background:#10283a;color:white">
      <option value="on">Speak replies</option>
      <option value="off">Text only</option>
    </select>
    <p class="muted">API key ko server environment mein configure karein, browser mein nahi.</p>
    <button id="closeSettings">Close</button>
  </div>

  <main class="center">
    <div>
      <div class="orb">J</div>
      <h1>VISION BOT</h1>
      <p class="muted" id="subtitle">Your personal AI assistant</p>
      <p class="muted">Press Tab to activate voice input</p>
      <section class="chat" id="chat">
        <div id="messages">
          <div class="message">JARVIS online. Aap kya karna chahte hain?</div>
        </div>
      </section>
    </div>
  </main>

  <form class="pill" id="commandForm">
    <button id="mic" type="button" title="Voice input">🎙</button>
    <input id="prompt" autocomplete="off" placeholder="Talk to JARVIS..." aria-label="Command">
    <button id="send" type="submit">Send</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
