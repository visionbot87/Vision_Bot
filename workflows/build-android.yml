name: Build Vision Bot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require website URL
        env:
          VISION_BOT_URL: ${{ vars.VISION_BOT_URL }}
        run: |
          if [ -z "$VISION_BOT_URL" ]; then
            echo "Missing repository variable VISION_BOT_URL. Set it to your deployed HTTPS website URL in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          case "$VISION_BOT_URL" in
            https://*) ;;
            *) echo "VISION_BOT_URL must start with https://"; exit 1 ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          VISION_BOT_URL: ${{ vars.VISION_BOT_URL }}
        run: gradle -p android assembleDebug -PVISION_BOT_URL="$VISION_BOT_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-bot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
